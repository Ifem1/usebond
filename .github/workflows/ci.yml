name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m py_compile contracts/*.py support/*.py
      - run: pytest tests/unit -q

  direct-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile contracts/*.py support/*.py
      - run: pytest tests/unit -q
      - run: pytest tests/direct -v

  contract-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: GenVM lint and SDK validation
        run: |
          set -euo pipefail
          for contract in \
            contracts/rights_registry.py \
            contracts/permission_engine.py \
            contracts/permit_book.py
          do
            echo "===== ${contract}: genvm-lint check ====="
            genvm-lint check "${contract}"
            echo "===== ${contract}: genvm-lint validate ====="
            genvm-lint validate "${contract}"
          done
      - name: Install GenLayer JS for deployment provenance
        run: npm install
      - name: Verify finalized deployment source against repository
        env:
          GENLAYER_RPC: https://studio.genlayer.com/api
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          import { createClient } from "genlayer-js";
          import { studionet } from "genlayer-js/chains";

          const client = createClient({
            chain: studionet,
            endpoint: process.env.GENLAYER_RPC,
          });

          const contracts = [
            {
              name: "RightsRegistry",
              address: "0x8D266231904d5eA14BEe00298A09BeC971572B2A",
              deployment: "0xf55ece2d712186155d8c6ee853992a1032ece3ba3146ad392d5db9d24328af21",
              path: "contracts/rights_registry.py",
            },
            {
              name: "PermissionEngine",
              address: "0x88C1b897759E57dD3f24c42ed26248FaE6F610A7",
              deployment: "0x3c85db1b81f24874ea21f65736047d6a71f24330bd8c34294203c05661b10429",
              path: "contracts/permission_engine.py",
            },
            {
              name: "PermitBook",
              address: "0xA7Ca373c4eb0A9da8770B310C60C1e3CE61F9676",
              deployment: "0x57e309bc5f5b7805614f608af40fbdb1d313fe0543f625c8842518d49b862c15",
              path: "contracts/permit_book.py",
            },
          ];

          const sha256 = (value) => createHash("sha256").update(value).digest("hex");
          const mismatches = [];
          const unavailable = [];

          for (const contract of contracts) {
            try {
              const tx = await client.getTransaction({ hash: contract.deployment });
              const status = String(tx?.statusName ?? tx?.status ?? "").toUpperCase();

              console.log(`${contract.name} address=${contract.address}`);
              console.log(`  deployment=${contract.deployment}`);
              console.log(`  transaction_status=${status}`);

              if (status !== "FINALIZED" && status !== "7") {
                throw new Error(`deployment transaction is not FINALIZED (status=${status})`);
              }

              let deployedBytes;
              let provenanceMethod = "";
              try {
                const codeB64 = await client.request({
                  method: "gen_getContractCode",
                  params: [contract.address],
                });
                if (typeof codeB64 === "string" && codeB64.length > 0) {
                  deployedBytes = Buffer.from(codeB64, "base64");
                  provenanceMethod = "gen_getContractCode legacy address parameter";
                }
              } catch (rpcError) {
                console.log(`  legacy_code_rpc_error=${String(rpcError)}`);
              }

              if (!deployedBytes) {
                const decoded = tx?.txDataDecoded;
                const deployedSource = decoded?.type === "deploy" ? decoded?.code : undefined;
                if (typeof deployedSource === "string" && deployedSource.length > 0) {
                  deployedBytes = Buffer.from(deployedSource, "utf8");
                  provenanceMethod = "finalized deployment transaction decoded code";
                }
              }

              if (!deployedBytes) {
                unavailable.push(contract.name);
                console.log("  deployed_source=unavailable (RPC and finalized deployment transaction exposed no source bytes)");
                console.log(`::warning::${contract.name}: exact deployed-source bytes unavailable from current Studionet interfaces`);
                continue;
              }

              const repositorySource = readFileSync(contract.path);
              const deployedSha = sha256(deployedBytes);
              const repositorySha = sha256(repositorySource);
              const exactMatch = deployedBytes.equals(repositorySource);

              console.log(`  provenance_method=${provenanceMethod}`);
              console.log(`  deployed_bytes=${deployedBytes.length} deployed_sha256=${deployedSha}`);
              console.log(`  repository_bytes=${repositorySource.length} repository_sha256=${repositorySha}`);
              console.log(`  exact_byte_match=${exactMatch}`);

              if (!exactMatch) mismatches.push(contract.name);
            } catch (error) {
              unavailable.push(contract.name);
              console.log(`${contract.name} address=${contract.address}`);
              console.log(`  deployment=${contract.deployment}`);
              console.log(`  deployed_source=unavailable (${String(error)})`);
              console.log(`::warning::${contract.name}: deployment-source comparison unavailable: ${String(error)}`);
            }
          }

          if (mismatches.length > 0) {
            throw new Error(`DEPLOYED SOURCE MISMATCH: ${mismatches.join(", ")}`);
          }

          if (unavailable.length > 0) {
            console.log(`Source comparison unavailable for: ${unavailable.join(", ")}`);
            console.log("No byte mismatch was observed; unavailable comparisons remain an external evidence limitation.");
          } else {
            console.log("All three finalized deployment sources exactly match repository bytes.");
          }
          NODE

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
